<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>按名称和规格核对库存 · 日常表格小帮手</title><meta name="description" content="可直接试用的模拟演示：按名称和规格核对库存。文件在当前浏览器处理。"></head><body data-tool="stock"><header class="topbar no-print"><a class="brand" href="index.html">日常表格小帮手</a><nav aria-label="工具导航"><a data-nav="vouchers" href="vouchers.html">批量填付款单</a><a data-nav="summary" href="summary.html">明细汇总</a><a data-nav="stock" href="stock.html">进出库存</a></nav></header>
<main class="wrap"><section class="intro no-print"><span class="pill">可直接试用的演示</span><h1 id="tool-title">按名称和规格核对库存</h1><p id="tool-subtitle"></p></section>
<div class="workspace"><section class="panel no-print" aria-label="输入明细"><h2>提供明细，看处理结果</h2><div class="actions"><button id="load-sample" class="primary">试用模拟样例</button><button id="download-sample">下载样例表</button></div>
<label class="file-label">选择你的明细文件<input id="csv-file" type="file" accept=".csv,text/csv"><span class="help">CSV UTF-8格式，最大2MB。Excel / WPS可另存为此格式。</span></label>
<label class="field" for="csv-input">也可直接粘贴CSV明细</label><textarea id="csv-input" spellcheck="false" placeholder="先加载样例，查看列名和数据格式。" aria-describedby="columns-help"></textarea><p id="columns-help" class="help"></p>
<div id="summary-options" hidden><p class="field">按哪些条件分别汇总</p><div id="groups" class="checks"></div><label class="field" for="amount-column">需要合计的金额列</label><select id="amount-column"></select></div>
<div id="voucher-options" hidden><label class="field" for="company">付款单位（可选）</label><input id="company" type="text" maxlength="80" placeholder="填写单位名称"></div>
<div class="actions"><button id="run" class="primary">处理明细</button></div><p class="help">文件只在当前浏览器处理；刷新页面会清空输入。请用脱敏样例试用。</p></section>
<section class="panel" aria-label="结果预览"><div class="no-print"><h2>结果预览与核对</h2><div id="status" class="status" role="status" aria-live="polite"></div></div><div id="results"><div class="empty">先试用模拟样例<br>这里会显示你的处理结果</div></div>
<div class="no-print"><label class="review"><input type="checkbox" id="review">我已核对样式、条数和关键数字</label><div class="actions"><button id="print" disabled>打印 / 保存为PDF</button><button id="export" disabled>下载核对结果CSV</button></div><p class="help">导出的编号在表格软件中请按文本列导入，以保留前导零。</p></div></section></div>
<footer class="footnote">当前为可运行的演示原型，示例数据均为模拟。可按现有单据样式、表头和统计规则定制。<br>AI辅助开发；请按约定样本与结果验收。<a href="README.md">使用说明与功能范围</a></footer></main><script src="core.js"></script><script src="app.js"></script></body></html>
